<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Squeaky's Misadventures 🐿️</title>
    <meta name="description" content="An interactive 1D random walk statistics simulation featuring Squeaky the squirrel on a lonely island. Built with HTML5 Canvas & Web Audio.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'CourierCustom';
            src: url('assets/fonts/courier.ttf') format('truetype');
        }

        :root {
            --bg-ocean: #007878;
            --panel-bg: rgba(7, 30, 38, 0.85);
            --panel-border: rgba(0, 240, 220, 0.25);
            --text-main: #f0fdfa;
            --text-muted: #99f6e4;
            --accent-cyan: #00f0d2;
            --accent-yellow: #facc15;
            --accent-red: #f43f5e;
            --accent-green: #10b981;
            --btn-bg: rgba(0, 240, 210, 0.15);
            --btn-hover: rgba(0, 240, 210, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: #021a20;
            color: var(--text-main);
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* App Wrapper */
        #app-container {
            position: relative;
            width: min(100vw, calc(100vh * (1600 / 801)));
            height: min(100vh, calc(100vw * (801 / 1600)));
            max-width: 1600px;
            max-height: 801px;
            aspect-ratio: 1600 / 801;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 240, 210, 0.15);
            border-radius: 12px;
            overflow: hidden;
            background: var(--bg-ocean);
            display: flex;
            flex-direction: column;
        }

        /* Top Bar */
        #top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            height: 52px;
            padding: 8px 18px;
            background: linear-gradient(180deg, rgba(2, 26, 32, 0.85) 0%, rgba(2, 26, 32, 0) 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            pointer-events: none;
        }

        .brand-group {
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: auto;
        }

        .brand-logo {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        .brand-title {
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .brand-subtitle {
            font-size: 0.75rem;
            color: var(--accent-cyan);
            font-weight: 600;
            background: rgba(0, 240, 210, 0.12);
            padding: 2px 8px;
            border-radius: 999px;
            border: 1px solid rgba(0, 240, 210, 0.25);
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: auto;
        }

        .action-btn {
            background: var(--panel-bg);
            color: var(--text-main);
            border: 1px solid var(--panel-border);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .action-btn:hover {
            background: var(--btn-hover);
            border-color: var(--accent-cyan);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .action-btn:active {
            transform: translateY(1px);
        }

        /* Canvas Area */
        #game-canvas {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        /* Bottom Controls Overlay */
        #controls-overlay {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 25;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        .control-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .control-label {
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .control-label span.val {
            color: var(--accent-cyan);
            font-family: 'JetBrains Mono', monospace;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 140px;
            height: 6px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.18);
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent-cyan);
            cursor: pointer;
            box-shadow: 0 0 10px var(--accent-cyan);
            transition: transform 0.15s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, #00f0d2 0%, #0284c7 100%);
            color: #021a20;
            font-weight: 700;
            border: none;
            padding: 8px 18px;
            border-radius: 10px;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 240, 210, 0.4);
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(0, 240, 210, 0.6);
            transform: translateY(-2px);
        }

        /* Toast / Banner Messages */
        #banner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 30;
            background: rgba(4, 30, 38, 0.92);
            backdrop-filter: blur(20px);
            border: 2px solid var(--accent-cyan);
            padding: 24px 36px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7), 0 0 40px rgba(0, 240, 210, 0.3);
            display: none;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        #banner h2 {
            font-size: 1.8rem;
            color: #ffffff;
            margin-bottom: 8px;
        }

        #banner p {
            color: var(--text-muted);
            margin-bottom: 20px;
            font-size: 1.05rem;
        }

        /* Keyboard Hints */
        .key-hint {
            display: inline-block;
            background: rgba(255,255,255,0.15);
            padding: 2px 7px;
            border-radius: 5px;
            border: 1px solid rgba(255,255,255,0.3);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: #ffffff;
        }

        /* Loading Screen */
        #loader {
            position: absolute;
            inset: 0;
            background: #021a20;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(0, 240, 210, 0.15);
            border-top-color: var(--accent-cyan);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div id="app-container">
    <!-- Top Bar -->
    <div id="top-bar">
        <div class="brand-group">
            <span class="brand-title">Squeaky's Misadventures</span>
            <span class="brand-subtitle">Random Walk on a Lonely Island</span>
        </div>
        <div class="top-actions">
            <button class="action-btn" id="btn-song" title="Change Song">🎵 Aao Twist Karein</button>
            <button class="action-btn" id="btn-mute" title="Toggle Sound">🔊 Sound On</button>
            <button class="action-btn" id="btn-fullscreen" title="Fullscreen">⛶</button>
        </div>
    </div>

    <!-- Main Canvas -->
    <canvas id="game-canvas" width="1600" height="801"></canvas>

    <!-- Bottom Controls Overlay -->
    <div id="controls-overlay">
        <div class="control-item">
            <div class="control-label">
                <span>Prob(Right)</span>
                <span class="val" id="val-prob">0.50</span>
            </div>
            <input type="range" id="slider-prob" min="0" max="1" step="0.01" value="0.5">
        </div>

        <div class="control-item">
            <div class="control-label">
                <span>Start Position</span>
                <span class="val" id="val-initpos">18</span>
            </div>
            <input type="range" id="slider-initpos" min="1" max="35" step="1" value="18">
        </div>

        <div class="control-item">
            <div class="control-label">
                <span>Speed</span>
                <span class="val" id="val-speed">1.0x</span>
            </div>
            <input type="range" id="slider-speed" min="0.5" max="2.5" step="0.01" value="1.0">
        </div>

        <button class="btn-primary" id="btn-main-action">▶ Start Game</button>
        <button class="action-btn" id="btn-reset" title="Reset (Esc)">Reset</button>
    </div>
</div>

<script>
/**
 * SQUEAKY: 1D Random Walk on a Lonely Island
 * Pure HTML5 Canvas + Web Audio API Implementation
 */

// --- CONFIG & CONSTANTS ---
const V_WIDTH = 1600;
const V_HEIGHT = 801;
const ISLAND_LENGTH = 36; // Number of discrete positions (0 to 36)
const REL_PADDING = 0.13; // 13% padding on left/right
const HOR_PADDING = REL_PADDING * V_WIDTH; // 208px
const USABLE_WIDTH = V_WIDTH * (1 - 2 * REL_PADDING); // 1184px
const SQUIRREL_SIZE = 80.1;
const SQUIRREL_Y = 0.67 * V_HEIGHT; // 536.7px
const SQUIRREL_DEATH_Y = (5 / 6) * V_HEIGHT; // 667.5px

// Grid positions for 0..36
function getGridX(pos) {
    return HOR_PADDING + (pos / ISLAND_LENGTH) * USABLE_WIDTH;
}

// Assets to load
const ASSETS = {
    images: {
        island: 'assets/image/island-final.png',
        squirrel: 'assets/image/squirrel.png',
        splash: 'assets/image/splash.png',
        heads: 'assets/image/heads.png',
        tails: 'assets/image/tails.png',
        plaksha: 'assets/image/plaksha.png'
    },
    audio: {
        music_twist: 'assets/music/aao_twist_karein.mp3',
        music_rock: 'assets/music/rock_around.mp3',
        death: 'assets/music/pacman_die.mp3'
    }
};

// --- GAME STATE ---
const state = {
    started: false,
    autoPlaying: false,
    dead: false,
    p_right: 0.5,
    init_pos: 18,
    cur_pos: 18,
    num_hops: 0,
    speed: 1.0,
    muted: false,
    currentSong: 'music_twist',

    // Probability Tree (Markov Walk History)
    nodes: [[...Array(ISLAND_LENGTH + 1)].map((_, i) => (i === 18 ? 1 : 0))],
    choices: [[...Array(ISLAND_LENGTH + 1)].fill(null)],
    edges: [[...Array(ISLAND_LENGTH + 1)].fill(null)],

    // Animations
    animating: false,
    animType: null,
    animProgress: 0,
    animStartPos: 18,
    animEndPos: 18,
    animDir: 1,
    coinText: 'HEADS',
    coinAngle: 0,
    deathY: SQUIRREL_Y
};

// --- IMAGE STORE ---
const loadedImages = {};

// --- AUDIO ENGINE ---
const audioTracks = {
    music_twist: new Audio('assets/music/aao_twist_karein.mp3'),
    music_rock: new Audio('assets/music/rock_around.mp3'),
    death: new Audio('assets/music/pacman_die.mp3')
};

// Pre-configure tracks
audioTracks.music_twist.loop = true;
audioTracks.music_rock.loop = true;

let currentAudio = audioTracks.music_twist;

function playMusic() {
    if (state.muted) return;
    currentAudio = audioTracks[state.currentSong] || audioTracks.music_twist;
    currentAudio.muted = false;
    currentAudio.volume = 1.0;
    
    // Start at ~20s mark for Aao Twist Karein (or beginning if rock)
    if (currentAudio.currentTime === 0 && state.currentSong === 'music_twist') {
        currentAudio.currentTime = 20;
    }

    const playPromise = currentAudio.play();
    if (playPromise !== undefined) {
        playPromise.catch(err => {
            console.log('Audio autoplay prevented, awaiting user gesture:', err);
        });
    }
}

function stopMusic() {
    if (currentAudio) {
        currentAudio.pause();
    }
}

function playDeathSound() {
    if (state.muted) return;
    try {
        audioTracks.death.currentTime = 0;
        audioTracks.death.play().catch(() => {});
    } catch(e) {}
}

// --- SETUP & PRELOAD ---
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d', { alpha: false });

function loadImg(key, url) {
    return new Promise((resolve) => {
        const img = new Image();
        img.src = url;
        if (img.complete && img.naturalWidth !== 0) {
            loadedImages[key] = img;
            resolve();
        } else {
            img.onload = () => { loadedImages[key] = img; resolve(); };
            img.onerror = () => { console.warn('Image load error:', url); resolve(); };
        }
    });
}

async function preload() {
    // 1. Start game loop and UI immediately
    resetGame();
    requestAnimationFrame(gameLoop);

    // 2. Load Images in background
    const imgPromises = Object.entries(ASSETS.images).map(([key, url]) => loadImg(key, url));
    await Promise.all(imgPromises);
}

// --- GAME LOGIC ---
function resetGame() {
    stopMusic();
    state.started = false;
    state.autoPlaying = false;
    state.dead = false;
    state.animating = false;
    state.num_hops = 0;
    state.cur_pos = state.init_pos;
    state.deathY = SQUIRREL_Y;

    // Reset Probability Tree
    state.nodes = [];
    state.choices = [];
    state.edges = [];
    state.nodes[0] = [...Array(ISLAND_LENGTH + 1)].map((_, i) => (i === state.cur_pos ? 1 : 0));
    state.choices[0] = [...Array(ISLAND_LENGTH + 1)].fill(null);
    state.edges[0] = [...Array(ISLAND_LENGTH + 1)].fill(null);

    document.getElementById('btn-main-action').innerText = '▶ Start Game';
}

function startGame() {
    state.started = true;
    state.dead = false;
    state.autoPlaying = true;
    playMusic();
    document.getElementById('btn-main-action').innerText = '⏸ Pause';
}

function toggleAutoPlay() {
    if (!state.started || state.dead) {
        if (state.dead) resetGame();
        startGame();
        return;
    }
    state.autoPlaying = !state.autoPlaying;
    if (state.autoPlaying) {
        playMusic();
    } else {
        stopMusic();
    }
    document.getElementById('btn-main-action').innerText = state.autoPlaying ? '⏸ Pause' : '▶ Resume';
}

function stepJump() {
    if (state.animating || state.dead) return;
    if (!state.started) {
        state.started = true;
        playMusic();
    }

    // Determine Jump Direction
    const jumpRight = Math.random() < state.p_right;
    const jump = jumpRight ? 1 : -1;
    const startPos = state.cur_pos;
    const nextPos = startPos + jump;

    state.animStartPos = startPos;
    state.animEndPos = nextPos;
    state.animDir = jump;
    state.coinText = jumpRight ? 'HEADS' : 'TAILS';
    state.num_hops += 1;
    state.cur_pos = nextPos;

    // Record Markov Tree Path
    state.choices.push([...Array(ISLAND_LENGTH + 1)].fill(null));
    state.choices[state.num_hops][state.cur_pos] = [jumpRight, !jumpRight, 'Red'];

    // Nodes
    state.nodes.push([...Array(ISLAND_LENGTH + 1)].fill(0));
    for (let i = 0; i <= ISLAND_LENGTH; i++) {
        let leftParent = (i > 0 && state.nodes[state.num_hops - 1][i - 1] === 1);
        let rightParent = (i < ISLAND_LENGTH && state.nodes[state.num_hops - 1][i + 1] === 1);
        if (leftParent || rightParent) {
            state.nodes[state.num_hops][i] = 1;
        }
    }

    // Edges
    state.edges.push([...Array(ISLAND_LENGTH + 1)].fill(null));
    for (let i = 0; i <= ISLAND_LENGTH; i++) {
        let leftParent = (i > 0 && state.nodes[state.num_hops - 1][i - 1] === 1);
        let rightParent = (i < ISLAND_LENGTH && state.nodes[state.num_hops - 1][i + 1] === 1);
        if (leftParent || rightParent) {
            state.edges[state.num_hops][i] = [leftParent, rightParent];
        }
    }

    // Start Hop & Coin Animation
    state.animating = true;
    state.animType = 'hop';
    state.animProgress = 0;
}

function handleDeath() {
    state.dead = true;
    state.autoPlaying = false;
    stopMusic();
    playDeathSound();

    state.animating = true;
    state.animType = 'death';
    state.animProgress = 0;
}

// --- RENDER ENGINE ---
let lastTime = 0;
let autoStepTimer = 0;

function gameLoop(time) {
    const dt = (time - lastTime) / 1000 || 0;
    lastTime = time;

    update(dt);
    draw();

    requestAnimationFrame(gameLoop);
}

function update(dt) {
    if (state.animating) {
        if (state.animType === 'hop') {
            state.animProgress += dt * 3.2 * state.speed;
            state.coinAngle = state.animProgress * Math.PI;

            if (state.animProgress >= 1.0) {
                state.animProgress = 1.0;
                state.animating = false;

                // Check death condition at shore (0 or 36)
                if (state.cur_pos <= 0 || state.cur_pos >= ISLAND_LENGTH) {
                    handleDeath();
                }
            }
        } else if (state.animType === 'death') {
            state.animProgress += dt * 1.5 * state.speed;
            state.deathY = SQUIRREL_Y + (SQUIRREL_DEATH_Y - SQUIRREL_Y) * Math.min(1.0, state.animProgress);

            if (state.animProgress >= 1.0) {
                state.animating = false;
                document.getElementById('btn-main-action').innerText = '▶ Play Again';
            }
        }
    } else if (state.started && state.autoPlaying && !state.dead) {
        autoStepTimer += dt * state.speed;
        // Step cadence synced to 88 BPM (60/88 ≈ 0.682s per beat)
        if (autoStepTimer >= 60 / 88) {
            autoStepTimer = 0;
            stepJump();
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, V_WIDTH, V_HEIGHT);

    // 1. Draw Background Island
    if (loadedImages.island) {
        ctx.drawImage(loadedImages.island, 0, 0, V_WIDTH, V_HEIGHT);
    } else {
        ctx.fillStyle = '#007878';
        ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);
    }

    // 2. Draw Probability Tree (Markov Tree Graph on Right)
    drawProbabilityTree();

    // 3. Draw Coin Toss Window
    drawCoinWindow();

    // 4. Draw Squeaky (Squirrel Sprite & Parabolic Hop Arc)
    drawSquirrel();

    // 5. Draw Live Probability & Status Overlay Text
    drawHudText();
}

function drawSquirrel() {
    let currentX = getGridX(state.cur_pos);
    let currentY = SQUIRREL_Y;
    // squirrel.png naturally faces left, so flip horizontally when moving right (+1)
    let flipX = (state.animDir === 1);

    if (state.animating && state.animType === 'hop') {
        const startX = getGridX(state.animStartPos);
        const endX = getGridX(state.animEndPos);
        const t = state.animProgress;

        // Smooth X interpolation
        currentX = startX + (endX - startX) * t;

        // Parabolic vertical jump arc (4 * h * t * (1-t))
        const jumpHeight = 36;
        currentY = SQUIRREL_Y - Math.sin(t * Math.PI) * jumpHeight;
    } else if (state.animType === 'death') {
        currentY = state.deathY;
    }

    ctx.save();
    ctx.translate(currentX, currentY);

    if (state.animType === 'death' && state.animProgress >= 0.95 && loadedImages.splash) {
        // Draw Splash
        ctx.drawImage(loadedImages.splash, -SQUIRREL_SIZE / 2, -SQUIRREL_SIZE / 2, SQUIRREL_SIZE, SQUIRREL_SIZE);
    } else if (loadedImages.squirrel) {
        if (flipX) {
            ctx.scale(-1, 1);
        }
        ctx.drawImage(loadedImages.squirrel, -SQUIRREL_SIZE / 2, -SQUIRREL_SIZE / 2, SQUIRREL_SIZE, SQUIRREL_SIZE);
    }
    ctx.restore();
}

function drawCoinWindow() {
    const coinBoxX = (1 - 1.79 / 3) * V_WIDTH; // 645px
    const coinBoxY = (1.03 / 2) * V_HEIGHT; // 412px
    const coinSize = 64;

    ctx.save();
    ctx.translate(coinBoxX, coinBoxY);

    // 3D Coin Rotation Scale
    let scaleX = Math.abs(Math.cos(state.coinAngle));
    let img = (state.coinText === 'HEADS') ? loadedImages.heads : loadedImages.tails;

    if (img) {
        ctx.save();
        ctx.scale(scaleX, 1);
        ctx.drawImage(img, -coinSize / 2, -coinSize / 2, coinSize, coinSize);
        ctx.restore();
    }

    // Text Label below coin
    ctx.font = 'bold 16px "JetBrains Mono", monospace';
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.fillText(state.coinText, 0, coinSize / 2 + 18);

    ctx.restore();
}

function drawProbabilityTree() {
    // Fixed box matching original Pygame: positioned at (1.79/3, 0.9/2) of canvas
    const treeW = 380;
    const treeH = 190;
    const treeX = (1.79 / 3) * V_WIDTH - treeW / 2;  // center the box
    const treeY = (0.9 / 2) * V_HEIGHT - treeH / 2;
    const relPad = 0.10;
    const padX = relPad * treeW;
    const padY = relPad * treeH * 1.75;

    ctx.save();
    ctx.translate(treeX, treeY);

    // Draw box background
    ctx.fillStyle = 'rgba(250, 250, 250, 0.07)';
    ctx.beginPath();
    ctx.roundRect(0, 0, treeW, treeH, 6);
    ctx.fill();

    // Clip to box
    ctx.beginPath();
    ctx.rect(0, 0, treeW, treeH);
    ctx.clip();

    // Header
    ctx.font = 'bold 13px "Outfit", sans-serif';
    ctx.fillStyle = '#f0fdfa';
    ctx.textAlign = 'center';
    ctx.fillText('Probability Path', treeW / 2, treeH * 9 / 10);

    const numHops = state.nodes.length;
    const N = Math.max(state.num_hops, 1);
    const k = 3;
    const Heff = treeH - 2 * padY;

    // Exponential compression coordinate mapping (matches original Pygame formula)
    const getNodePos = (row, col) => {
        const x = padX + col * ((treeW - 2 * padX) / ISLAND_LENGTH);
        const y = padY + Heff * row * (Math.exp(k * (row / N - 1)) / N);
        return { x, y };
    };

    // 1. Draw Grid Lines (Grey)
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(150, 150, 150, 0.5)';
    for (let r = 1; r < numHops; r++) {
        for (let c = 0; c <= ISLAND_LENGTH; c++) {
            const edge = state.edges[r] && state.edges[r][c];
            if (edge) {
                const current = getNodePos(r, c);
                if (edge[0]) {
                    const parent = getNodePos(r - 1, c - 1);
                    ctx.beginPath();
                    ctx.moveTo(parent.x, parent.y);
                    ctx.lineTo(current.x, current.y);
                    ctx.stroke();
                }
                if (edge[1]) {
                    const parent = getNodePos(r - 1, c + 1);
                    ctx.beginPath();
                    ctx.moveTo(parent.x, parent.y);
                    ctx.lineTo(current.x, current.y);
                    ctx.stroke();
                }
            }
        }
    }

    // 2. Draw Walk Path (Fluorescent Green, thicker)
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#00fa00';
    for (let r = 1; r < numHops; r++) {
        for (let c = 0; c <= ISLAND_LENGTH; c++) {
            const choice = state.choices[r] && state.choices[r][c];
            if (choice) {
                const current = getNodePos(r, c);
                if (choice[0]) {
                    const parent = getNodePos(r - 1, c - 1);
                    ctx.beginPath();
                    ctx.moveTo(parent.x, parent.y);
                    ctx.lineTo(current.x, current.y);
                    ctx.stroke();
                }
                if (choice[1]) {
                    const parent = getNodePos(r - 1, c + 1);
                    ctx.beginPath();
                    ctx.moveTo(parent.x, parent.y);
                    ctx.lineTo(current.x, current.y);
                    ctx.stroke();
                }
            }
        }
    }

    // 3. Draw Visited Nodes (small red dots)
    ctx.fillStyle = '#ff2b2b';
    for (let r = 0; r < numHops; r++) {
        for (let c = 0; c <= ISLAND_LENGTH; c++) {
            if (state.nodes[r] && state.nodes[r][c] === 1) {
                const pos = getNodePos(r, c);
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }

    ctx.restore();
}

function drawHudText() {
    ctx.save();

    // Hops Counter & Position (Top Center)
    ctx.font = 'bold 22px "JetBrains Mono", monospace';
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,0.8)';
    ctx.shadowBlur = 6;
    ctx.fillText(`Hops: ${state.num_hops}  |  Position: ${state.cur_pos} / ${ISLAND_LENGTH}`, V_WIDTH / 2, 40);

    // Initial Start Message (Center Screen if not started)
    if (!state.started) {
        ctx.font = 'bold 28px "Outfit", sans-serif';
        ctx.fillStyle = '#facc15';
        ctx.shadowColor = 'rgba(0,0,0,0.9)';
        ctx.shadowBlur = 10;
        ctx.fillText('Welcome! Press Spacebar or click Start Game', V_WIDTH / 2, V_HEIGHT / 2 - 80);

        ctx.font = '600 18px "Outfit", sans-serif';
        ctx.fillStyle = '#99f6e4';
        ctx.fillText('Use the sliders below to adjust jump probabilities and starting position', V_WIDTH / 2, V_HEIGHT / 2 - 45);
    } else if (state.dead && !state.animating) {
        ctx.font = 'bold 30px "Outfit", sans-serif';
        ctx.fillStyle = '#f43f5e';
        ctx.shadowColor = 'rgba(0,0,0,0.9)';
        ctx.shadowBlur = 10;
        ctx.fillText('🌊 Squeaky Fell into the Ocean!', V_WIDTH / 2, V_HEIGHT / 2 - 80);

        ctx.font = '600 20px "Outfit", sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(`Survived ${state.num_hops} hops before meeting his demise! Press Spacebar or click Play Again`, V_WIDTH / 2, V_HEIGHT / 2 - 45);
    }

    ctx.restore();
}

// --- USER INTERACTION & CONTROLS ---

// Sliders
document.getElementById('slider-prob').addEventListener('input', (e) => {
    state.p_right = parseFloat(e.target.value);
    document.getElementById('val-prob').innerText = state.p_right.toFixed(2);
});

document.getElementById('slider-initpos').addEventListener('input', (e) => {
    state.init_pos = parseInt(e.target.value);
    document.getElementById('val-initpos').innerText = state.init_pos;
    if (!state.started) {
        state.cur_pos = state.init_pos;
        state.nodes[0] = [...Array(ISLAND_LENGTH + 1)].map((_, i) => (i === state.cur_pos ? 1 : 0));
    }
});

document.getElementById('slider-speed').addEventListener('input', (e) => {
    state.speed = parseFloat(e.target.value);
    document.getElementById('val-speed').innerText = state.speed.toFixed(1) + 'x';
});

// Buttons
document.getElementById('btn-main-action').addEventListener('click', toggleAutoPlay);
document.getElementById('btn-reset').addEventListener('click', resetGame);

// Sound Toggle
document.getElementById('btn-mute').addEventListener('click', () => {
    state.muted = !state.muted;
    if (currentAudio) {
        currentAudio.muted = state.muted;
    }
    document.getElementById('btn-mute').innerText = state.muted ? '🔇 Sound Muted' : '🔊 Sound On';
    if (!state.muted && state.started && !state.dead && state.autoPlaying) {
        playMusic();
    }
});

// Song Switcher
document.getElementById('btn-song').addEventListener('click', () => {
    stopMusic();
    if (state.currentSong === 'music_twist') {
        state.currentSong = 'music_rock';
        document.getElementById('btn-song').innerText = '🎵 Rock Around';
    } else {
        state.currentSong = 'music_twist';
        document.getElementById('btn-song').innerText = '🎵 Aao Twist Karein';
    }
    if (state.started && !state.dead && state.autoPlaying) {
        playMusic();
    }
});

// Fullscreen Toggle
document.getElementById('btn-fullscreen').addEventListener('click', () => {
    if (!document.fullscreenElement) {
        document.getElementById('app-container').requestFullscreen().catch(err => alert(err.message));
    } else {
        document.exitFullscreen();
    }
});

// Keyboard Controls
window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
        e.preventDefault();
        if (!state.started || state.dead) {
            if (state.dead) resetGame();
            startGame();
        } else {
            stepJump();
        }
    } else if (e.code === 'Escape') {
        resetGame();
    } else if (e.code === 'KeyM') {
        document.getElementById('btn-mute').click();
    }
});

// Initialize and start preloading
preload();
</script>
